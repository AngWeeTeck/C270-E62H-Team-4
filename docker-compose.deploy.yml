services:
  backend:
    image: ${DEPLOY_IMAGE:?DEPLOY_IMAGE must be set}
    container_name: forum-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://forum-mongodb:27017/forum_db
    networks:
      - forum-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"const http=require('http');const req=http.get('http://127.0.0.1:5000/',res=>{res.resume();process.exit(res.statusCode>=200&&res.statusCode<400?0:1)});req.setTimeout(5000,()=>{req.destroy();process.exit(1)});req.on('error',()=>process.exit(1));\""
        ]
      interval: 10s
      timeout: 8s
      retries: 5
      start_period: 30s

networks:
  forum-network:
    external: true
    name: forum-network
