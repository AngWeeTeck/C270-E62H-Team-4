# Fill in your VM IP(s) and SSH user.
# One VM to start is fine — put it under [staging] and get the demo working.
# Add a second VM under [production] when you're ready for the promotion step.

[staging]
staging-ip ansible_user=ubuntu

[production]
prod-ip ansible_user=ubuntu

[app_servers:children]
staging
production

[app_servers:vars]
ansible_python_interpreter=/usr/bin/python3
